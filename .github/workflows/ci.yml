name: 🚀 Shopora CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # ═══════════════════════════════════════════
  # STAGE 1: Lint & Code Quality
  # ═══════════════════════════════════════════
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend ESLint
        run: npx eslint . --ignore-pattern node_modules/ --ignore-pattern client/

      - name: Install frontend dependencies
        run: cd client && npm ci

      - name: Run frontend ESLint
        run: cd client && npm run lint

  # ═══════════════════════════════════════════
  # STAGE 2: Backend Tests
  # ═══════════════════════════════════════════
  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-key-12345' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-test-session-secret' }}
      NODE_ENV: test
      RAZORPAY_KEY_ID: rzp_test_dummy
      RAZORPAY_KEY_SECRET: dummy_razorpay_secret
      CLOUDINARY_CLOUD_NAME: test_cloud
      CLOUDINARY_API_KEY: test_api_key
      CLOUDINARY_API_SECRET: test_api_secret
      EMAIL_USER: test@test.com
      EMAIL_PASS: testpass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --forceExit --detectOpenHandles --coverage --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 7

  # ═══════════════════════════════════════════
  # STAGE 3: Frontend Tests & Build
  # ═══════════════════════════════════════════
  frontend-tests:
    name: 🎨 Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Run tests
        run: cd client && npx vitest run

      - name: Build production bundle
        run: cd client && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/dist/
          retention-days: 7

  # ═══════════════════════════════════════════
  # STAGE 4: Security Audit
  # ═══════════════════════════════════════════
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: npm ci

      - name: Backend security audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Install frontend dependencies
        run: cd client && npm ci

      - name: Frontend security audit
        run: cd client && npm audit --audit-level=high || true
        continue-on-error: true

  # ═══════════════════════════════════════════
  # STAGE 5: Docker Build & Push
  # ═══════════════════════════════════════════
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
