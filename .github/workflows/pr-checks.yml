name: 📋 PR Checks

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  pr-check:
    name: ✅ PR Validation
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-jwt-secret-key-12345
      SESSION_SECRET: ci-test-session-secret
      NODE_ENV: test
      RAZORPAY_KEY_ID: rzp_test_dummy
      RAZORPAY_KEY_SECRET: dummy_razorpay_secret
      CLOUDINARY_CLOUD_NAME: test_cloud
      CLOUDINARY_API_KEY: test_api_key
      CLOUDINARY_API_SECRET: test_api_secret
      EMAIL_USER: test@test.com
      EMAIL_PASS: testpass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: 🔍 Backend lint
        run: npx eslint . --ignore-pattern node_modules/ --ignore-pattern client/

      - name: 🧪 Backend tests
        run: npx jest --forceExit --detectOpenHandles --ci

      - name: Install frontend dependencies
        run: cd client && npm ci

      - name: 🔍 Frontend lint
        run: cd client && npm run lint

      - name: 🧪 Frontend tests
        run: cd client && npx vitest run

      - name: 🏗️ Frontend build check
        run: cd client && npm run build

      - name: ✅ All checks passed
        run: echo "All PR checks passed successfully! ✅"
